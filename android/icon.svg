<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Rich Dark Solid Gradient matched to the Electric Lime Logo -->
    <linearGradient id="solidDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <!-- Refined Subdued Diagonal Stripes Pattern -->
    <pattern id="diagonalStripes" width="90" height="90" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <!-- High contrast overlay matched carefully to deep dark backgrounds -->
      <rect width="36" height="90" fill="#ffffff" fill-opacity="0.012" />
    </pattern>
  </defs>

  <!-- Solid Dark Gradient Background -->
  <rect width="1000" height="1000" fill="url(#solidDarkGrad)" />
  
  <!-- Subtle Background Pattern Overlay -->
  <rect width="1000" height="1000" fill="url(#diagonalStripes)" />

  <!-- Inner Content Group (Scaled to 58% for perfect adaptive icon fit) -->
  <g transform="translate(500, 500) scale(0.58) translate(-500, -500)">
    <!-- Smoothed play button shape in requested electric lime/yellow-green -->
    <path d="M 236 335
             L 236 250
             A 90 90 0 0 1 372 172
             L 775 415
             A 90 90 0 0 1 775 569
             L 372 812
             A 90 90 0 0 1 236 734
             L 236 649
             A 222 222 0 0 0 478 683
             L 685 558
             A 75 75 0 0 0 685 426
             L 478 301
             A 222 222 0 0 0 236 335 Z" fill="#C8FF00" />

    <!-- Perfectly aligned and geometry-balanced White "G" -->
    <path d="M 544 492
             A 167 167 0 1 1 500 375
             A 12 12 0 0 1 499 392
             L 477 414
             A 12 12 0 0 1 460 414
             A 112 112 0 1 0 485 525
             L 388 525
             A 12 12 0 0 1 378 506
             L 396 482
             A 12 12 0 0 1 406 477
             L 529 477
             A 15 15 0 0 1 544 492 Z" fill="#FFFFFF" />
  </g>
</svg>